<section class="container mx-auto px-4 pb-12">
    <h2 class="text-3xl font-bold text-white mb-8">// ÚLTIMAS PUBLICACIONES</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <!-- Nueva sintaxis de Angular 17+ súper limpia -->
        @for (noticia of noticias; track $index) {
            <article class="bg-techCard rounded-lg overflow-hidden border border-gray-800 hover:border-techAccent transition-colors">
                
                <img [src]="noticia.imagen" [alt]="noticia.titulo" class="w-full h-48 object-cover">
                
                <div class="p-6">
                    <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">{{ noticia.categoria }}</span>
                    <h3 class="text-xl font-bold text-white mt-3 mb-2">{{ noticia.titulo }}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-3">{{ noticia.resumen }}</p>
                    
                    <div class="flex justify-between items-center text-sm text-gray-500">
                        <span>{{ noticia.fecha }}</span>
                        <button [routerLink]="['/detalle', noticia.id]" class="text-techAccent hover:text-white transition-colors flex items-center gap-1 font-semibold cursor-pointer">
    Ver más <span aria-hidden="true">&rarr;</span>
</button>
                    </div>
                </div>
            </article>
        } @empty {
            <!-- Esto se muestra solo si el Array está vacío o cargando -->
            <p class="text-gray-400 col-span-3 text-center py-10">Cargando artículos...</p>
        }
        
    </div>
</section>
