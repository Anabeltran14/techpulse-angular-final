<section class="container mx-auto px-4 py-12 flex justify-center">
    <div class="bg-techCard rounded-xl overflow-hidden border border-gray-800 flex flex-col md:flex-row w-full max-w-4xl shadow-2xl mt-10">
        
        <!-- Panel Izquierdo: Hablemos -->
        <div class="bg-gray-900/80 p-10 md:w-2/5 flex flex-col justify-center">
            <h2 class="text-3xl font-bold text-white mb-4">Hablemos</h2>
            <p class="text-gray-400 mb-8 text-sm leading-relaxed">¿Tienes un proyecto en mente, una consulta sobre nuestros artículos o quieres colaborar con TechPulse? Escríbenos y nuestro equipo te responderá pronto.</p>
            <div class="space-y-4 text-sm text-gray-300">
                <div class="flex items-center gap-3"><span class="text-techAccent text-lg">✉</span> contacto@techpulse.com</div>
                <div class="flex items-center gap-3"><span class="text-techAccent text-lg">📍</span> Bogotá, Colombia</div>
            </div>
        </div>
        
        <!-- Panel Derecho: Formulario -->
        <div class="p-10 md:w-3/5">
            <form (submit)="enviarMensaje($event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Nombre completo <span class="text-techAccent">*</span></label>
                    <input type="text" required class="w-full bg-techBg border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-techAccent transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Correo electrónico <span class="text-techAccent">*</span></label>
                    <input type="email" required class="w-full bg-techBg border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-techAccent transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Mensaje <span class="text-techAccent">*</span></label>
                    <textarea required rows="4" class="w-full bg-techBg border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-techAccent transition-colors"></textarea>
                </div>
                
                <!-- Directiva moderna @if para mostrar el mensaje de éxito dinámicamente -->
                @if (mensajeEnviado) {
                    <div class="bg-green-900/40 border border-green-500 text-green-300 px-4 py-3 rounded-lg text-sm text-center font-medium">
                        ¡Tu mensaje ha sido enviado correctamente!
                    </div>
                }

                <button type="submit" class="w-full bg-techAccent hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                    Enviar mensaje <span aria-hidden="true">&rarr;</span>
                </button>
            </form>
        </div>
        
    </div>
</section>
